name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version_file = Path("src/taps/__about__.py").read_text()
          match = re.search(r'^__version__ = "([^"]+)"$', version_file, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read the package version from __about__.py")

          expected_tag = f"v{match.group(1)}"
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match package version "
                  f"{expected_tag!r}"
              )
          PY

      - name: Build Docker image (hatch stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: hatch
          tags: shell-ci:latest

      - name: Build wheel and sdist inside Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            shell-ci:latest build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/